services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qurany
      POSTGRES_USER: qurany
      POSTGRES_PASSWORD: qurany
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qurany -d qurany"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://qurany:qurany@postgres:5432/qurany
      JWT_SECRET: dev-secret-change-me
      WHISPER_MODEL: OdyAsh/faster-whisper-base-ar-quran
      WHISPER_COMPUTE_TYPE: float32
      WHISPER_DEVICE: cpu
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../data:/app/data
      - whisper-cache:/root/.cache/huggingface

volumes:
  postgres-data:
  whisper-cache:
